services:
  transmission:
    image: edgd1er/nordlynx-transmission:latest
    restart: unless-stopped
    ports:
      - "2080:1080" #socks proxy port
      - "2888:8888" #http proxy port
      - "9091:9091" #Transmission
    privileged: true # required for nordvpn client >=3.17.0
    cap_add:
      - NET_ADMIN               # Required
      #- SYS_MODULE              # Required for TECHNOLOGY=NordLynx ?
    sysctls:
      #      - net.ipv4.conf.all.rp_filter=2 # Loose Reverse Path: https://access.redhat.com/solutions/53031
      - net.ipv6.conf.all.disable_ipv6=1 # disable ipv6
    environment:
      - TZ=America/Chicago#set timezone
      - COUNTRY=uk # select vpn country curl -LSs https://api.nordvpn.com/v1/servers/countries | tr '\n' ', ' | ++ jq -r '.[].code'
      #- CITY=brussels # select city curl -LsS 'https://api.nordvpn.com/v1/servers/countries' | jq ' .[]| select (.name|test("United states";"i")) | .cities[].name'
      - GROUP=P2P # nordvpn group, P2P suggested. curl https://api.nordvpn.com/v1/servers/groups | jq -r '[.[].title] | @csv'
      - CYBER_SEC=off # nordvpn feature
      - DEBUG=false
      - NORDVPN_TOKEN=<token> #Not required if using secrets
      - #- NORDVPN_VERSION=3.16.9
      - ANALYTICS=off # or on, sending anonymous aggregate data: crash reports, OS version, marketing performance, and feature usage data
      - TECHNOLOGY=NordLynx # technology nordlynx = nordvpn, openvpn, used only when NORDVPN_PRIVKEY (wireguard) is not set.
      - PROTOCOL=tcp # or udp (default), useful only when using openvpn. wireguard is udp only.
      - OBFUSCATE=off # or on, obfuscate only available when using openvpn(tcp or udp), hide use of vpn.
      - GENERATE_WIREGUARD_CONF=false #write /etc/wireguard/wg0.conf if true. Will download 56 MB, docker 317 MB of additional disk space will be used.
      - TINYUSER= #optional, enforces authentication over tinyproxy when set with TINYPASS, add authorization with danteuser:${TINYPASS} to socks proxy
      - TINYPASS= #optional, enforces authentication over tinyproxy when set with TINYUSER.
      - DANTE_LOGOUTPUT=file # stdout or file (>/config/log/dante.log)
      - TINY_LOGOUTPUT=file # stdout or file (>/config/log/tinyproxy.log)
      - LOG_TO_STDOUT=false # write transmission logs to stdout or to transmission.log

      - IPTABLES_LEGACY=N
      - OPEN_FILES_LIMIT=
      - ENABLE_UFW=true #enable firewall
      - UFW_ALLOW_GW_NET=true #allow gateway network
      - UFW_DISABLE_IPTABLES_REJECT=false #
      - UFW_EXTRA_PORTS= #allow other ports
      - IPTABLES_LOG=2 #active packet logging
      - WEBPROXY_ENABLED=true # web proxy enable
      - WEBPROXY_PORT=8888 # web proxy port
      - DANTE_LOGOUTPUT=file # stdout or file (>/config/log/dante.log)
      - TINY_LOGOUTPUT=file # stdout or file (>/config/log/tinyproxy.log)
      - ALLOWED_IPS=0.0.0.0/0 # define ips routed through wireguard interface 0.0.0.0/0, ::0
      - LISTEN_PORT=37749
      - TABLE=auto
      - FWMARK=0x1fe1
      - 'TRANSMISSION_BIND_ADDRESS_IPV6=::'
      - NORDVPN_DEBUG=false
      - DANTE_DEBUG=2 # 0-2
      - DANTE_LOGLEVEL=data # connect, disconnect, ioop, data, tcpinfo
      - TRANSMISSION_DEBUG=false
      - DROP_DEFAULT_ROUTE=false
      - PEER_DNS=true
      - LOG_TO_STDOUT=false
      - ENABLE_UFW=false
      - GLOBAL_APPLY_PERMISSIONS=true
      - HEALTH_CHECK_HOST=google.com
      #- LOCAL_NETWORK=192.168.53.0/24
      - PGID=100
      - PUID=1001
      - TINY_LOGLEVEL=connect #Critical,Error,Warning,Notice,Connect
      - TRANSMISSION_ALT_SPEED_DOWN=1500
      - TRANSMISSION_ALT_SPEED_ENABLED=false
      - TRANSMISSION_ALT_SPEED_TIME_BEGIN=540
      - TRANSMISSION_ALT_SPEED_TIME_DAY=62
      - TRANSMISSION_ALT_SPEED_TIME_ENABLED=true
      - TRANSMISSION_ALT_SPEED_TIME_END=1020
      - TRANSMISSION_ALT_SPEED_UP=150
      - TRANSMISSION_BIND_ADDRESS_IPV4=0.0.0.0
      - TRANSMISSION_BLOCKLIST_ENABLED=true
      - TRANSMISSION_BLOCKLIST_URL=https://github.com/Naunter/BT_BlockLists/raw/master/bt_blocklists.gz
      - TRANSMISSION_CACHE_SIZE_MB=4
      - TRANSMISSION_DHT_ENABLED=true
      - TRANSMISSION_DOWNLOAD_LIMIT=5000
      - TRANSMISSION_DOWNLOAD_LIMIT_ENABLED=0
      - TRANSMISSION_DOWNLOAD_QUEUE_ENABLED=true
      - TRANSMISSION_DOWNLOAD_QUEUE_SIZE=5
      - TRANSMISSION_ENCRYPTION=1
      - TRANSMISSION_IDLE_SEEDING_LIMIT=30
      - TRANSMISSION_IDLE_SEEDING_LIMIT_ENABLED=false
      - TRANSMISSION_INCOMPLETE_DIR=/data/incomplete
      - TRANSMISSION_INCOMPLETE_DIR_ENABLED=true
      - TRANSMISSION_LOGLEVEL=trace
      - TRANSMISSION_LPD_ENABLED=true
      - TRANSMISSION_MAX_PEERS_GLOBAL=200
      - TRANSMISSION_MESSAGE_LEVEL=2
      #- TRANSMISSION_PEER_CONGESTION_ALGORITHM=
      - TRANSMISSION_PEER_ID_TTL_HOURS=6
      - TRANSMISSION_PEER_LIMIT_GLOBAL=200
      - TRANSMISSION_PEER_LIMIT_PER_TORRENT=50
      - TRANSMISSION_PEER_PORT=51413
      - TRANSMISSION_PEER_PORT_RANDOM_HIGH=65535
      - TRANSMISSION_PEER_PORT_RANDOM_LOW=49152
      - TRANSMISSION_PEER_PORT_RANDOM_ON_START=false
      - TRANSMISSION_PEER_SOCKET_TOS=default
      - TRANSMISSION_PEX_ENABLED=true
      - TRANSMISSION_PORT_FORWARDING_ENABLED=false
      - TRANSMISSION_PREALLOCATION=1
      - TRANSMISSION_PREFETCH_ENABLED=1
      - TRANSMISSION_QUEUE_STALLED_ENABLED=true
      - TRANSMISSION_QUEUE_STALLED_MINUTES=30
      - TRANSMISSION_RATIO_LIMIT=2
      - TRANSMISSION_RATIO_LIMIT_ENABLED=false
      - TRANSMISSION_RENAME_PARTIAL_FILES=true
      - TRANSMISSION_RPC_BIND_ADDRESS=0.0.0.0
      - TRANSMISSION_RPC_ENABLED=true
      - TRANSMISSION_RPC_HOST_WHITELIST=
      - TRANSMISSION_RPC_HOST_WHITELIST_ENABLED=false
      - TRANSMISSION_RPC_PORT=9091
      - TRANSMISSION_RPC_AUTHENTICATION_REQUIRED=true
      - TRANSMISSION_RPC_URL=/transmission/
      #- TRANSMISSION_RPC_USERNAME=username
      #- TRANSMISSION_RPC_PASSWORD=password
      - TRANSMISSION_RPC_WHITELIST=127.0.0.1,192.168.53.*,172.23.0.*
      - TRANSMISSION_RPC_WHITELIST_ENABLED=true
      - TRANSMISSION_SCRAPE_PAUSED_TORRENTS_ENABLED=true
      - TRANSMISSION_SCRIPT_TORRENT_DONE_ENABLED=false
      - TRANSMISSION_SCRIPT_TORRENT_DONE_FILENAME=
      - TRANSMISSION_SEED_QUEUE_ENABLED=false
      - TRANSMISSION_SEED_QUEUE_SIZE=10
      - TRANSMISSION_SPEED_LIMIT_DOWN=5000
      - TRANSMISSION_SPEED_LIMIT_DOWN_ENABLED=true
      - TRANSMISSION_SPEED_LIMIT_UP=250
      - TRANSMISSION_SPEED_LIMIT_UP_ENABLED=true
      - TRANSMISSION_START_ADDED_TORRENTS=true
      - TRANSMISSION_TRASH_ORIGINAL_TORRENT_FILES=false
      - TRANSMISSION_UMASK=2
      - TRANSMISSION_UPLOAD_LIMIT=100
      - TRANSMISSION_UPLOAD_LIMIT_ENABLED=0
      - TRANSMISSION_UPLOAD_SLOTS_PER_TORRENT=14
      - TRANSMISSION_UTP_ENABLED=true
      - TRANSMISSION_WATCH_DIR_ENABLED=true
      - TRANSMISSION_WATCH_DIR_FORCE_GENERIC=false
      #TRANSMISSION_WEB_UI=combustion|kettu|transmission-web-control|flood
      - TRANSMISSION_WEB_UI=transmission-web-control
    secrets:
      - NORDVPN_CREDS
      #- NORDVPN_PRIVKEY
      - RPC_CREDS
      - TINY_CREDS
    volumes:
      - ./your_storage_path/:/data # where transmission will store the data
      - ./your_config_path/transmission-home/:/config/transmission-home/ # where transmission-home is stored
      - logvol:/config/log/ # where transmission-home is stored

secrets:
  TINY_CREDS:
    file: ./tiny_creds
  RPC_CREDS:
    file: ./rpc_creds
  NORDVPN_CREDS:
    file: ./nordvpn_creds
  NORDVPN_PRIVKEY:
    file: ./nordvpn_privkey

volumes:
    logvol: